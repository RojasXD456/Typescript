<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <script type="module">
    import cBodega from "./dist/controllers/Cl_cBodega.js";
    new cBodega();
  </script>
  <div id="body">
    <section id="articulo" hidden>
      <div>
        <h5 id="articulo_lblArticulo">Procesar Artículo</h5>
      </div>
      <div>
        <label>Nombre:
          <input type="text" id="articulo_inNombre" placeholder="Cuaderno">
        </label>
      </div>
      <div>
        <label>Costo:
          <input type="number" id="articulo_inCosto" placeholder="Ej: 100">
        </label>
      </div>
      <div>
        <button id="articulo_btCancelar">Cancelar</button>
        <button id="articulo_btAceptar">Aceptar</button>
      </div>
    </section>
    <hr>
    <div style="margin-bottom: 20px;">
      <button id="body_btProcesar1Articulo">Procesar 1 Articulo</button>
    </div>

    <div>
      El artículo <span id="body_lblNombreArticulo">0</span> tiene un precio de venta de Bs. <span
        id="body_lblPrecioDeVenta">0</span>
    </div>
    <div>
      La ganancia será de Bs. <span id="body_lblGanancia">0</span>
    </div>
    <div>
      El articulo con mayor ganancia es: <span id="body_lblArticuloMayGanancia">0</span>
    </div>
</body>

</html>
